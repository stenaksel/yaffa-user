# YAFFA generator properties — settings shared by every generator and both
# shells' runtimes. The generators copy this file, unchanged, next to the
# runtime (gen/<shell>-stuff/func/generator.properties); incl.sh and incl.ps1
# read it when they load. See SPEC.md §4.
#
# Format: key=value lines; '#' starts a comment line. A value in double
# quotes is taken exactly as written between them, leading spaces included
# (unlike Java .properties, the quotes aren't part of the value). A missing
# key uses the layout shown here.

# What running an alias shows before the command's own output — one template
# per kind of line. output.description and output.step are shown in the order
# they're listed here: put output.step first to show the "name => command"
# lines above the description. (output.message lines come from the
# requirement checks, before either.)
#   <description>  one line of the alias's description (repeated for each line)
#   <name>         the alias or synonym typed, or each alias of a chain
#   <command>      the command it runs
#   <level>        fix, warn or error
#   <message>      what a requirement check reports
# An unknown <placeholder> is shown as written.
output.step="  <name> => <command>"
output.description="  <description>"
output.message="  [<level>] <message>"
